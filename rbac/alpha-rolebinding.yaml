apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-user
  namespace: team-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha-readonly-binding
  namespace: team-alpha
subjects:
- kind: ServiceAccount
  name: alpha-user
  namespace: team-alpha
roleRef:
  kind: Role
  name: alpha-readonly
  apiGroup: rbac.authorization.k8s.io
