apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-alpha
  namespace: team-beta
spec:
  podSelector:
    matchLabels:
      app: beta-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: team-alpha
    ports:
    - protocol: TCP
      port: 80
